name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore backend/CrudApi/CrudApi.csproj

      - name: Run backend tests
        run: dotnet test backend/CrudApi.Tests/CrudApi.Tests.csproj --configuration Release

      - name: Build backend
        run: dotnet build backend/CrudApi/CrudApi.csproj --configuration Release --no-restore

  infrastructure:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore infrastructure
        run: dotnet restore infrastructure/CrudAppCdk/CrudAppCdk.csproj

      - name: Build infrastructure
        run: dotnet build infrastructure/CrudAppCdk/CrudAppCdk.csproj --configuration Release --no-restore
